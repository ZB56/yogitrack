# Continuous integration for YogiTrack.
#
# Runs on every push and every pull request to main. The job installs both the
# server and client dependencies, builds the React app, and boots the server
# against a real MongoDB to confirm it actually starts and answers.
#
# The point is that a broken commit is caught here rather than on Heroku, so
# main stays in a releasable state. Deployment itself is configured in Heroku
# (Deploy -> GitHub -> "Wait for CI to pass before deploy"), which is why this
# file builds and verifies but does not push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    # A throwaway MongoDB for the boot check, so the test is a real connection
    # rather than a mock.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint the React app
        run: npm run lint --prefix client

      - name: Build the React app
        run: npm run build --prefix client

      - name: Start the server and check it responds
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/yogitrack_ci
          PORT: 5001
          # A throwaway secret for this run only. Tokens signed with it stop
          # working the moment the job ends, which is the point.
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
          # The seed account the checks below sign in as. Also throwaway: the
          # database it is created in is deleted with the service container.
          MANAGER_USERNAME: ci-manager
          MANAGER_PASSWORD: ci-only-password
        run: |
          set -euo pipefail

          node server/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Poll rather than sleeping a fixed time: faster when the server is
          # ready quickly, and it still fails cleanly if it never comes up.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/api/health > /dev/null; then
              echo "Server is up."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Server did not start within 30 seconds."
              exit 1
            fi
            sleep 1
          done

          echo "Checking that a protected endpoint refuses an anonymous request..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/instructors)
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 without a token, got $STATUS"
            exit 1
          fi

          echo "Creating the manager account and signing in..."
          npm run create:manager

          TOKEN=$(curl -s -X POST http://localhost:5001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$MANAGER_USERNAME\",\"password\":\"$MANAGER_PASSWORD\"}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).token;if(!t){console.error('no token in login response');process.exit(1)}console.log(t)})")

          AUTH="Authorization: Bearer $TOKEN"

          echo "Checking every resource endpoint answers for a signed-in manager..."
          for path in instructors customers packages classes sales attendance; do
            curl -sf -H "$AUTH" "http://localhost:5001/api/$path" > /dev/null
            echo "  /api/$path ok"
          done

          echo "Checking the four UC7 reports run..."
          for report in package-sales instructors customers teacher-payments; do
            curl -sf -H "$AUTH" "http://localhost:5001/api/reports/$report" > /dev/null
            echo "  /api/reports/$report ok"
          done

          echo "Checking that validation rejects a bad record..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:5001/api/instructors \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"firstName":"NoOtherFields"}')
          if [ "$STATUS" != "400" ]; then
            echo "Expected 400 from an invalid create, got $STATUS"
            exit 1
          fi

          echo "Checking that a wrong password is refused..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:5001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$MANAGER_USERNAME\",\"password\":\"definitely-not-it\"}")
          if [ "$STATUS" != "401" ]; then
            echo "Expected 401 from a wrong password, got $STATUS"
            exit 1
          fi

          echo "All checks passed."
