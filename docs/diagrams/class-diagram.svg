<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" font-family="Helvetica, Arial, sans-serif">
  <title>YogiTrack domain class diagram</title>
  <desc>UML class diagram of the seven YogiTrack collections and their associations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5840"/>
    </marker>
  </defs>

  <style>
    .box       { fill:#ffffff; stroke:#3a5840; stroke-width:1.6; }
    .box-p2    { fill:#ffffff; stroke:#8a9a8c; stroke-width:1.6; stroke-dasharray:6 4; }
    .hdr       { fill:#e5ede6; stroke:#3a5840; stroke-width:1.6; }
    .hdr-p2    { fill:#f2f5f2; stroke:#8a9a8c; stroke-width:1.6; stroke-dasharray:6 4; }
    .cname     { font-size:15px; font-weight:700; fill:#1c211d; text-anchor:middle; }
    .stereo    { font-size:10.5px; fill:#6b746d; text-anchor:middle; font-style:italic; }
    .attr      { font-size:11.5px; fill:#3d453f; font-family:"SF Mono", Menlo, Consolas, monospace; }
    .op        { font-size:11.5px; fill:#4a7050; font-family:"SF Mono", Menlo, Consolas, monospace; font-style:italic; }
    .sep       { stroke:#3a5840; stroke-width:1; }
    .sep-p2    { stroke:#8a9a8c; stroke-width:1; stroke-dasharray:6 4; }
    .edge      { stroke:#3a5840; stroke-width:1.5; fill:none; }
    .mult      { font-size:11px; fill:#3a5840; font-weight:600; }
    .role      { font-size:11px; fill:#6b746d; font-style:italic; }
    .legend    { font-size:12px; fill:#3d453f; }
    .note      { fill:#fdf4e3; stroke:#d8bc7f; stroke-width:1.2; }
    .notetxt   { font-size:11px; fill:#8a5c14; }
  </style>

  <!-- ===================== INSTRUCTOR (Part 1) ===================== -->
  <rect class="box" x="40" y="50" width="250" height="218" rx="4"/>
  <path class="hdr" d="M40 54 a4 4 0 0 1 4 -4 h242 a4 4 0 0 1 4 4 v34 h-250 z"/>
  <line class="sep" x1="40" y1="88" x2="290" y2="88"/>
  <text class="cname" x="165" y="74">Instructor</text>
  <text class="attr" x="52" y="108">- instructorId : String {unique}</text>
  <text class="attr" x="52" y="125">- firstName : String</text>
  <text class="attr" x="52" y="142">- lastName : String</text>
  <text class="attr" x="52" y="159">- address : String</text>
  <text class="attr" x="52" y="176">- phone : String</text>
  <text class="attr" x="52" y="193">- email : String</text>
  <text class="attr" x="52" y="210">- preferredContact : ContactMode</text>
  <text class="attr" x="52" y="227">- active : Boolean = true</text>
  <line class="sep" x1="40" y1="238" x2="290" y2="238"/>
  <text class="op" x="52" y="256">/ fullName : String</text>

  <!-- ===================== CUSTOMER (Part 1) ===================== -->
  <rect class="box" x="420" y="50" width="250" height="218" rx="4"/>
  <path class="hdr" d="M420 54 a4 4 0 0 1 4 -4 h242 a4 4 0 0 1 4 4 v34 h-250 z"/>
  <line class="sep" x1="420" y1="88" x2="670" y2="88"/>
  <text class="cname" x="545" y="74">Customer</text>
  <text class="attr" x="432" y="108">- customerId : String {unique}</text>
  <text class="attr" x="432" y="125">- firstName : String</text>
  <text class="attr" x="432" y="142">- lastName : String</text>
  <text class="attr" x="432" y="159">- address : String</text>
  <text class="attr" x="432" y="176">- phone : String</text>
  <text class="attr" x="432" y="193">- email : String</text>
  <text class="attr" x="432" y="210">- preferredContact : ContactMode</text>
  <text class="attr" x="432" y="227">- classBalance : Number = 0</text>
  <line class="sep" x1="420" y1="238" x2="670" y2="238"/>
  <text class="op" x="432" y="256">/ fullName : String</text>

  <!-- ===================== PACKAGE (Part 1) ===================== -->
  <rect class="box" x="800" y="50" width="270" height="218" rx="4"/>
  <path class="hdr" d="M800 54 a4 4 0 0 1 4 -4 h262 a4 4 0 0 1 4 4 v34 h-270 z"/>
  <line class="sep" x1="800" y1="88" x2="1070" y2="88"/>
  <text class="cname" x="935" y="74">Package</text>
  <text class="attr" x="812" y="108">- packageId : String {unique}</text>
  <text class="attr" x="812" y="125">- name : String</text>
  <text class="attr" x="812" y="142">- category : PackageCategory</text>
  <text class="attr" x="812" y="159">- numClasses : Number | null</text>
  <text class="attr" x="812" y="176">- unlimited : Boolean = false</text>
  <text class="attr" x="812" y="193">- classType : ClassType</text>
  <text class="attr" x="812" y="210">- startDate : Date</text>
  <text class="attr" x="812" y="227">- endDate : Date</text>
  <text class="attr" x="812" y="244">- price : Number</text>

  <!-- ===================== CLASS (Part 2) ===================== -->
  <rect class="box-p2" x="40" y="348" width="250" height="160" rx="4"/>
  <path class="hdr-p2" d="M40 352 a4 4 0 0 1 4 -4 h242 a4 4 0 0 1 4 4 v34 h-250 z"/>
  <line class="sep-p2" x1="40" y1="386" x2="290" y2="386"/>
  <text class="cname" x="165" y="366">Class</text>
  <text class="stereo" x="165" y="399">(Part 2)</text>
  <text class="attr" x="52" y="419">- classId : String {unique}</text>
  <text class="attr" x="52" y="436">- instructorId : String «FK»</text>
  <text class="attr" x="52" y="453">- day, time</text>
  <text class="attr" x="52" y="470">- durationMinutes : Number</text>
  <text class="attr" x="52" y="487">- classType : ClassType</text>
  <text class="attr" x="52" y="504">- payRate : Number</text>

  <!-- ===================== SALE (Part 2) ===================== -->
  <rect class="box-p2" x="620" y="348" width="250" height="177" rx="4"/>
  <path class="hdr-p2" d="M620 352 a4 4 0 0 1 4 -4 h242 a4 4 0 0 1 4 4 v34 h-250 z"/>
  <line class="sep-p2" x1="620" y1="386" x2="870" y2="386"/>
  <text class="cname" x="745" y="366">Sale</text>
  <text class="stereo" x="745" y="399">(Part 2)</text>
  <text class="attr" x="632" y="419">- saleId : String {unique}</text>
  <text class="attr" x="632" y="436">- customerId : String «FK»</text>
  <text class="attr" x="632" y="453">- packageId : String «FK»</text>
  <text class="attr" x="632" y="470">- amountPaid : Number</text>
  <text class="attr" x="632" y="487">- paymentMode : String</text>
  <text class="attr" x="632" y="504">- paidAt, validFrom, validTo</text>

  <!-- ===================== ATTENDANCE (Part 2) ===================== -->
  <rect class="box-p2" x="300" y="596" width="300" height="143" rx="4"/>
  <path class="hdr-p2" d="M300 600 a4 4 0 0 1 4 -4 h292 a4 4 0 0 1 4 4 v34 h-300 z"/>
  <line class="sep-p2" x1="300" y1="634" x2="600" y2="634"/>
  <text class="cname" x="450" y="614">Attendance</text>
  <text class="stereo" x="450" y="647">(Part 2)</text>
  <text class="attr" x="312" y="667">- classId : String «FK»</text>
  <text class="attr" x="312" y="684">- instructorId : String «FK»</text>
  <text class="attr" x="312" y="701">- heldAt : Date</text>
  <text class="attr" x="312" y="718">- customerIds : String[ ] «FK»</text>

  <!-- ===================== COUNTER (Part 1) ===================== -->
  <rect class="box" x="800" y="596" width="270" height="92" rx="4"/>
  <path class="hdr" d="M800 600 a4 4 0 0 1 4 -4 h262 a4 4 0 0 1 4 4 v34 h-270 z"/>
  <line class="sep" x1="800" y1="634" x2="1070" y2="634"/>
  <text class="cname" x="935" y="620">Counter</text>
  <text class="attr" x="812" y="654">- _id : String  // "instructor"</text>
  <text class="attr" x="812" y="671">- seq : Number</text>

  <!-- Counter note -->
  <path class="note" d="M800 706 h250 l20 20 v42 h-270 z"/>
  <path class="note" d="M1050 706 v20 h20 z"/>
  <text class="notetxt" x="812" y="726">Supplies every I/C/P/L/S id by</text>
  <text class="notetxt" x="812" y="742">atomic $inc. Not a domain entity;</text>
  <text class="notetxt" x="812" y="758">shown because it is a collection.</text>

  <!-- ===================== ASSOCIATIONS ===================== -->

  <!-- Instructor 1 to 0..* Class : teaches -->
  <path class="edge" d="M165 268 V348" marker-end="url(#arrow)"/>
  <text class="mult" x="172" y="288">1</text>
  <text class="role" x="172" y="313">teaches</text>
  <text class="mult" x="172" y="340">0..*</text>

  <!-- Customer 1 to 0..* Sale : buys -->
  <path class="edge" d="M545 268 V310 H690 V348" marker-end="url(#arrow)"/>
  <text class="mult" x="552" y="286">1</text>
  <text class="role" x="588" y="303">buys</text>
  <text class="mult" x="697" y="342">0..*</text>

  <!-- Package 1 to 0..* Sale : sold as -->
  <path class="edge" d="M935 268 V310 H800 V348" marker-end="url(#arrow)"/>
  <text class="mult" x="942" y="286">1</text>
  <text class="role" x="840" y="303">sold as</text>
  <text class="mult" x="760" y="342">0..*</text>

  <!-- Class 1 to 0..* Attendance : held as. Enters the top edge, so no
       association line ever crosses an attribute row. -->
  <path class="edge" d="M165 508 V560 H340 V596" marker-end="url(#arrow)"/>
  <text class="mult" x="172" y="528">1</text>
  <text class="role" x="196" y="553">held as</text>
  <text class="mult" x="347" y="590">0..*</text>

  <!-- Instructor to Attendance : records -->
  <path class="edge" d="M290 200 H330 V545 H420 V596" marker-end="url(#arrow)"/>
  <text class="role" x="336" y="380">records</text>
  <text class="mult" x="427" y="590">0..*</text>

  <!-- Customer to Attendance : attends -->
  <path class="edge" d="M420 232 H390 V530 H500 V596" marker-end="url(#arrow)"/>
  <text class="role" x="396" y="420">attends</text>
  <text class="mult" x="507" y="590">0..*</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="40" y="772" width="620" height="68" rx="4" fill="#f4f7f4" stroke="#c9dbcb" stroke-width="1.2"/>
  <text class="legend" x="56" y="794" font-weight="700">Legend</text>
  <rect x="120" y="783" width="26" height="14" fill="#fff" stroke="#3a5840" stroke-width="1.6"/>
  <text class="legend" x="154" y="795">Built in Part 1</text>
  <rect x="280" y="783" width="26" height="14" fill="#fff" stroke="#8a9a8c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="legend" x="314" y="795">Planned for Part 2</text>
  <text class="legend" x="56" y="822" font-size="10.5" fill="#6b746d">«FK» = a stored reference to another collection. MongoDB does not enforce it; the Express controllers check that the target exists.</text>
</svg>
