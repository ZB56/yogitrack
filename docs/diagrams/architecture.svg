<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 940" width="1160" height="940" font-family="Helvetica, Arial, sans-serif">
  <title>YogiTrack architecture and deployment</title>
  <desc>Component view of one request through the MERN stack, and the development and production deployment topologies.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5840"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4714d"/>
    </marker>
  </defs>

  <style>
    .sect      { font-size:15px; font-weight:700; fill:#1c211d; }
    .sectsub   { font-size:11.5px; fill:#6b746d; }
    .comp      { fill:#ffffff; stroke:#3a5840; stroke-width:1.6; }
    .comp-r    { fill:#ffffff; stroke:#5b7fa8; stroke-width:1.6; }
    .comp-db   { fill:#f6ece6; stroke:#b4714d; stroke-width:1.6; }
    .comp-svc  { fill:#f4f7f4; stroke:#5e8c63; stroke-width:1.4; stroke-dasharray:5 3; }
    .ctitle    { font-size:12.5px; font-weight:700; fill:#1c211d; text-anchor:middle; }
    .cfile     { font-size:9.5px; fill:#6b746d; text-anchor:middle; font-family:"SF Mono", Menlo, monospace; }
    .cdesc     { font-size:10px; fill:#3d453f; text-anchor:middle; }
    .flow      { stroke:#3a5840; stroke-width:1.6; fill:none; }
    .flow-db   { stroke:#b4714d; stroke-width:1.6; fill:none; }
    .flabel    { font-size:9.5px; fill:#4a7050; text-anchor:middle; font-weight:600; }
    .zone      { fill:#f4f7f4; stroke:#c9dbcb; stroke-width:1.4; }
    .zone-p    { fill:#f7f9fb; stroke:#b9cbdd; stroke-width:1.4; }
    .ztitle    { font-size:13px; font-weight:700; fill:#3a5840; }
    .ztitle-p  { font-size:13px; font-weight:700; fill:#41618a; }
    .znote     { font-size:10.5px; fill:#6b746d; }
    .tag       { font-size:9.5px; fill:#fff; font-weight:700; text-anchor:middle; }
  </style>

  <!-- =========================================================
       SECTION 1 — component view
       ========================================================= -->
  <text class="sect" x="30" y="40">1. Component view &#8212; the path of a single request</text>
  <text class="sectsub" x="30" y="60">Each box is a folder in the repository. The same path serves every use case; UC1 is shown in brackets.</text>

  <!-- React SPA -->
  <rect class="comp-r" x="30" y="92" width="175" height="96" rx="5"/>
  <text class="ctitle" x="117" y="116">React SPA</text>
  <text class="cfile" x="117" y="132">client/src/</text>
  <text class="cdesc" x="117" y="152">pages, components,</text>
  <text class="cdesc" x="117" y="166">api/ fetch wrapper</text>
  <text class="cdesc" x="117" y="182" font-style="italic">[ AddInstructor.jsx ]</text>

  <!-- Middleware -->
  <rect class="comp" x="240" y="92" width="165" height="96" rx="5"/>
  <text class="ctitle" x="322" y="116">Middleware</text>
  <text class="cfile" x="322" y="132">server/middleware/</text>
  <text class="cdesc" x="322" y="152">cors, express.json,</text>
  <text class="cdesc" x="322" y="166">error handler</text>

  <!-- Router -->
  <rect class="comp" x="440" y="92" width="145" height="96" rx="5"/>
  <text class="ctitle" x="512" y="116">Router</text>
  <text class="cfile" x="512" y="132">server/routes/</text>
  <text class="cdesc" x="512" y="152">url &#8594; function</text>
  <text class="cdesc" x="512" y="172" font-style="italic">[ instructorRoutes ]</text>

  <!-- Controller -->
  <rect class="comp" x="620" y="92" width="165" height="96" rx="5"/>
  <text class="ctitle" x="702" y="116">Controller</text>
  <text class="cfile" x="702" y="132">server/controllers/</text>
  <text class="cdesc" x="702" y="152">business rules,</text>
  <text class="cdesc" x="702" y="166">duplicate check</text>

  <!-- Model -->
  <rect class="comp" x="820" y="92" width="155" height="96" rx="5"/>
  <text class="ctitle" x="897" y="116">Mongoose model</text>
  <text class="cfile" x="897" y="132">server/models/</text>
  <text class="cdesc" x="897" y="152">schema, validation,</text>
  <text class="cdesc" x="897" y="166">enums, indexes</text>

  <!-- MongoDB -->
  <rect class="comp-db" x="1010" y="92" width="120" height="96" rx="5"/>
  <text class="ctitle" x="1070" y="116">MongoDB</text>
  <text class="cfile" x="1070" y="132">collections</text>
  <text class="cdesc" x="1070" y="152">documents</text>
  <text class="cdesc" x="1070" y="166">on disk</text>

  <!-- flow arrows -->
  <path class="flow" d="M205 140 H240" marker-end="url(#a)"/>
  <text class="flabel" x="222" y="132">HTTP</text>
  <path class="flow" d="M405 140 H440" marker-end="url(#a)"/>
  <path class="flow" d="M585 140 H620" marker-end="url(#a)"/>
  <path class="flow" d="M785 140 H820" marker-end="url(#a)"/>
  <path class="flow-db" d="M975 140 H1010" marker-end="url(#ao)"/>

  <!-- Services hanging off the controller -->
  <rect class="comp-svc" x="600" y="240" width="205" height="80" rx="5"/>
  <text class="ctitle" x="702" y="262">Services</text>
  <text class="cfile" x="702" y="277">server/services/</text>
  <text class="cdesc" x="702" y="296">idGenerator &#8212; atomic I/C/P ids</text>
  <text class="cdesc" x="702" y="310">messaging &#8212; confirmations</text>
  <path class="flow" d="M702 188 V240" marker-end="url(#a)"/>

  <!-- note on the return path -->
  <path class="flow" d="M1070 188 V214 H117 V188" marker-end="url(#a)" stroke-dasharray="6 4" stroke="#6b746d"/>
  <text class="flabel" x="560" y="208" fill="#6b746d">JSON response travels back the same way (errors land in the error handler)</text>

  <!-- =========================================================
       SECTION 2 — deployment views
       ========================================================= -->
  <text class="sect" x="30" y="382">2. Deployment view</text>
  <text class="sectsub" x="30" y="402">The same code runs in both. What changes is who serves the React files and where the database lives.</text>

  <!-- = DEVELOPMENT = -->
  <rect class="zone" x="30" y="424" width="530" height="290" rx="6"/>
  <text class="ztitle" x="48" y="450">Development &#8212; one laptop</text>

  <rect class="comp-r" x="52" y="470" width="180" height="62" rx="5"/>
  <text class="ctitle" x="142" y="492">Browser</text>
  <text class="cdesc" x="142" y="510">localhost:5173</text>
  <text class="cdesc" x="142" y="524" font-style="italic">hot reload on save</text>

  <rect class="comp-r" x="52" y="562" width="180" height="62" rx="5"/>
  <text class="ctitle" x="142" y="584">Vite dev server</text>
  <text class="cdesc" x="142" y="602">serves React from source</text>
  <text class="cdesc" x="142" y="616" font-style="italic">proxies /api &#8594; :5001</text>

  <rect class="comp" x="330" y="470" width="180" height="62" rx="5"/>
  <text class="ctitle" x="420" y="492">Express (node)</text>
  <text class="cdesc" x="420" y="510">localhost:5001</text>
  <text class="cdesc" x="420" y="524" font-style="italic">API only</text>

  <rect class="comp-db" x="330" y="562" width="180" height="62" rx="5"/>
  <text class="ctitle" x="420" y="584">MongoDB</text>
  <text class="cdesc" x="420" y="602">127.0.0.1:27017</text>
  <text class="cdesc" x="420" y="616" font-style="italic">database: yogitrack</text>

  <path class="flow" d="M142 532 V562" marker-end="url(#a)"/>
  <path class="flow" d="M232 593 H290 V501 H330" marker-end="url(#a)"/>
  <text class="flabel" x="291" y="546">/api proxy</text>
  <path class="flow-db" d="M420 532 V562" marker-end="url(#ao)"/>
  <text class="znote" x="48" y="664">Two processes, two ports. The proxy is what lets the React code call</text>
  <text class="znote" x="48" y="680">a relative &#8220;/api/...&#8221; URL that will still be correct in production.</text>
  <text class="znote" x="48" y="700" font-style="italic">MONGODB_URI comes from .env, which is git-ignored.</text>

  <!-- = PRODUCTION = -->
  <rect class="zone-p" x="600" y="424" width="530" height="290" rx="6"/>
  <text class="ztitle-p" x="618" y="450">Production &#8212; Heroku + Atlas</text>

  <rect class="comp-r" x="622" y="470" width="180" height="62" rx="5"/>
  <text class="ctitle" x="712" y="492">Browser</text>
  <text class="cdesc" x="712" y="510">any device</text>
  <text class="cdesc" x="712" y="524" font-style="italic">https</text>

  <rect class="comp" x="622" y="562" width="270" height="88" rx="5"/>
  <text class="ctitle" x="757" y="584">Heroku Eco dyno &#8212; one process</text>
  <text class="cdesc" x="757" y="604">Express serves the compiled React build</text>
  <text class="cdesc" x="757" y="620">from client/dist AND the /api routes</text>
  <text class="cdesc" x="757" y="638" font-style="italic">PORT supplied by Heroku at runtime</text>

  <rect class="comp-db" x="940" y="562" width="170" height="88" rx="5"/>
  <text class="ctitle" x="1025" y="584">MongoDB Atlas</text>
  <text class="cdesc" x="1025" y="604">managed cluster</text>
  <text class="cdesc" x="1025" y="620">mongodb+srv://</text>
  <text class="cdesc" x="1025" y="638" font-style="italic">URI = Heroku config var</text>

  <path class="flow" d="M712 532 V562" marker-end="url(#a)"/>
  <text class="flabel" x="760" y="550">one origin</text>
  <path class="flow-db" d="M892 606 H940" marker-end="url(#ao)"/>

  <text class="znote" x="618" y="674">One process, one origin, so no CORS and no proxy are needed. The</text>
  <text class="znote" x="618" y="690">build step (heroku-postbuild) compiles the client before the dyno starts.</text>
  <text class="znote" x="618" y="710" font-style="italic">No secret is ever committed; Atlas credentials live only in Heroku config vars.</text>

  <!-- =========================================================
       SECTION 3 — CI/CD
       ========================================================= -->
  <text class="sect" x="30" y="762">3. Delivery pipeline</text>

  <rect class="comp" x="30" y="784" width="150" height="58" rx="5"/>
  <text class="ctitle" x="105" y="808">Local commit</text>
  <text class="cdesc" x="105" y="826">git commit</text>

  <rect class="comp" x="230" y="784" width="150" height="58" rx="5"/>
  <text class="ctitle" x="305" y="808">GitHub</text>
  <text class="cdesc" x="305" y="826">origin/main</text>

  <rect class="comp" x="430" y="784" width="170" height="58" rx="5"/>
  <text class="ctitle" x="515" y="808">GitHub Actions</text>
  <text class="cdesc" x="515" y="826">install, build, smoke test</text>

  <rect class="comp" x="650" y="784" width="170" height="58" rx="5"/>
  <text class="ctitle" x="735" y="808">Heroku</text>
  <text class="cdesc" x="735" y="826">build and release</text>

  <rect class="comp-db" x="870" y="784" width="170" height="58" rx="5"/>
  <text class="ctitle" x="955" y="808">Live application</text>
  <text class="cdesc" x="955" y="826">herokuapp.com</text>

  <path class="flow" d="M180 813 H230" marker-end="url(#a)"/>
  <text class="flabel" x="205" y="806">push</text>
  <path class="flow" d="M380 813 H430" marker-end="url(#a)"/>
  <path class="flow" d="M600 813 H650" marker-end="url(#a)"/>
  <text class="flabel" x="625" y="806">on pass</text>
  <path class="flow" d="M820 813 H870" marker-end="url(#a)"/>

  <text class="znote" x="30" y="878">A failing build stops the deploy, so main is always in a releasable state. This pipeline is a Part 2 requirement; it is set up in Part 1</text>
  <text class="znote" x="30" y="894">so that every later change ships the same way.</text>
</svg>
