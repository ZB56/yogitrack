<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 950" width="1120" height="950" font-family="Helvetica, Arial, sans-serif">
  <title>YogiTrack use-case diagram, scoped by delivery increment</title>
  <desc>UML use-case diagram of the seven written use cases, showing the Manager and Instructor actors and which use cases ship in Part 1 and Part 2.</desc>

  <defs>
    <marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#6b746d" stroke-width="1.3"/>
    </marker>
  </defs>

  <style>
    .bound     { fill:#fbfcfb; stroke:#3a5840; stroke-width:1.8; }
    .boundname { font-size:14px; font-weight:700; fill:#3a5840; text-anchor:middle; }
    .uc1       { fill:#e5ede6; stroke:#3a5840; stroke-width:1.8; }
    .uc2       { fill:#ffffff; stroke:#8a9a8c; stroke-width:1.6; stroke-dasharray:6 4; }
    .ucsub     { fill:#ffffff; stroke:#8a9a8c; stroke-width:1.4; stroke-dasharray:6 4; }
    .uctxt     { font-size:12.5px; font-weight:600; fill:#1c211d; text-anchor:middle; }
    .ucid      { font-size:10px; font-weight:700; fill:#4a7050; text-anchor:middle; }
    .ucid2     { font-size:10px; font-weight:700; fill:#8a9a8c; text-anchor:middle; }
    .ucsubtxt  { font-size:11px; fill:#3d453f; text-anchor:middle; }
    .actor     { stroke:#1c211d; stroke-width:1.8; fill:none; }
    .actorname { font-size:13px; font-weight:700; fill:#1c211d; text-anchor:middle; }
    .assoc     { stroke:#6b746d; stroke-width:1.3; fill:none; }
    .genline   { stroke:#6b746d; stroke-width:1.3; fill:none; }
    .legend    { font-size:11.5px; fill:#3d453f; }
    .note      { font-size:11px; fill:#8a5c14; }
  </style>

  <!-- ===== SYSTEM BOUNDARY ===== -->
  <rect class="bound" x="215" y="40" width="660" height="770" rx="6"/>
  <text class="boundname" x="545" y="66">YogiTrack</text>

  <!-- ===== PART 1 USE CASES ===== -->
  <ellipse class="uc1" cx="400" cy="120" rx="118" ry="33"/>
  <text class="ucid" x="400" y="113">UC1</text>
  <text class="uctxt" x="400" y="130">Add an instructor</text>

  <ellipse class="uc1" cx="400" cy="200" rx="118" ry="33"/>
  <text class="ucid" x="400" y="193">UC4</text>
  <text class="uctxt" x="400" y="210">Add a customer</text>

  <ellipse class="uc1" cx="400" cy="280" rx="118" ry="33"/>
  <text class="ucid" x="400" y="273">UC3</text>
  <text class="uctxt" x="400" y="290">Add a package</text>

  <!-- ===== PART 2 USE CASES ===== -->
  <ellipse class="uc2" cx="400" cy="375" rx="118" ry="33"/>
  <text class="ucid2" x="400" y="368">UC2</text>
  <text class="uctxt" x="400" y="385">Add a class</text>

  <ellipse class="uc2" cx="400" cy="455" rx="118" ry="33"/>
  <text class="ucid2" x="400" y="448">UC5</text>
  <text class="uctxt" x="400" y="465">Record a sale</text>

  <ellipse class="uc2" cx="400" cy="540" rx="118" ry="33"/>
  <text class="ucid2" x="400" y="533">UC6</text>
  <text class="uctxt" x="400" y="550">Record class attendance</text>

  <ellipse class="uc2" cx="400" cy="655" rx="118" ry="33"/>
  <text class="ucid2" x="400" y="648">UC7</text>
  <text class="uctxt" x="400" y="665">Generate studio reports</text>

  <!-- ===== UC7 SPECIALISATIONS ===== -->
  <ellipse class="ucsub" cx="720" cy="590" rx="112" ry="27"/>
  <text class="ucsubtxt" x="720" y="594">Package sales</text>

  <ellipse class="ucsub" cx="720" cy="652" rx="112" ry="27"/>
  <text class="ucsubtxt" x="720" y="649">Instructors, classes</text>
  <text class="ucsubtxt" x="720" y="663">and check-ins</text>

  <ellipse class="ucsub" cx="720" cy="714" rx="112" ry="27"/>
  <text class="ucsubtxt" x="720" y="711">Customers and their</text>
  <text class="ucsubtxt" x="720" y="725">packages</text>

  <ellipse class="ucsub" cx="720" cy="776" rx="112" ry="27"/>
  <text class="ucsubtxt" x="720" y="773">Monthly teacher</text>
  <text class="ucsubtxt" x="720" y="787">payment</text>

  <!-- generalisation arrows, hollow triangle pointing at the parent UC7 -->
  <path class="genline" d="M608 590 H560"/>
  <path class="genline" d="M608 652 H560"/>
  <path class="genline" d="M608 714 H560"/>
  <path class="genline" d="M608 776 H560"/>
  <path class="genline" d="M560 590 V776"/>
  <path class="genline" d="M560 655 H518" marker-end="url(#gen)"/>

  <!-- ===== ACTOR: MANAGER ===== -->
  <circle class="actor" cx="95" cy="290" r="17"/>
  <line class="actor" x1="95" y1="307" x2="95" y2="352"/>
  <line class="actor" x1="68" y1="322" x2="122" y2="322"/>
  <line class="actor" x1="95" y1="352" x2="74" y2="388"/>
  <line class="actor" x1="95" y1="352" x2="116" y2="388"/>
  <text class="actorname" x="95" y="412">Manager</text>

  <!-- ===== ACTOR: INSTRUCTOR ===== -->
  <circle class="actor" cx="1015" cy="420" r="17"/>
  <line class="actor" x1="1015" y1="437" x2="1015" y2="482"/>
  <line class="actor" x1="988" y1="452" x2="1042" y2="452"/>
  <line class="actor" x1="1015" y1="482" x2="994" y2="518"/>
  <line class="actor" x1="1015" y1="482" x2="1036" y2="518"/>
  <text class="actorname" x="1015" y="542">Instructor</text>

  <!-- ===== ASSOCIATIONS: MANAGER ===== -->
  <path class="assoc" d="M118 300 L283 130"/>
  <path class="assoc" d="M120 310 L283 205"/>
  <path class="assoc" d="M122 322 L283 283"/>
  <path class="assoc" d="M122 340 L283 372"/>
  <path class="assoc" d="M120 352 L283 450"/>
  <path class="assoc" d="M110 372 L285 638"/>

  <!-- ===== ASSOCIATION: INSTRUCTOR ===== -->
  <path class="assoc" d="M992 440 L518 535"/>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="600" width="165" height="132" rx="5" fill="#f4f7f4" stroke="#c9dbcb" stroke-width="1.2"/>
  <text class="legend" x="44" y="622" font-weight="700">Legend</text>
  <ellipse class="uc1" cx="62" cy="646" rx="18" ry="11"/>
  <text class="legend" x="88" y="650">Part 1</text>
  <ellipse class="uc2" cx="62" cy="678" rx="18" ry="11"/>
  <text class="legend" x="88" y="682">Part 2</text>
  <path class="genline" d="M46 708 H78" marker-end="url(#gen)"/>
  <text class="legend" x="88" y="712">generalises</text>

  <!-- ===== NOTE ===== -->
  <path d="M30 838 h800 l18 18 v70 H30 z" fill="#fdf4e3" stroke="#d8bc7f" stroke-width="1.2"/>
  <path d="M830 838 v18 h18 z" fill="#fdf4e3" stroke="#d8bc7f" stroke-width="1.2"/>
  <text class="note" x="44" y="858" font-weight="700">Scope note</text>
  <text class="note" x="44" y="877">This diagram shows the seven written use cases from the course specification, renumbered 1&#8211;7 (the source labels two of them</text>
  <text class="note" x="44" y="893">&#8220;Use case 5&#8221;). The course Fig. 5 diagram is broader than the written specification; the differences are catalogued in</text>
  <text class="note" x="44" y="909">docs/08-use-case-diagram.md and tracked as open decisions 10&#8211;12 in docs/07-design-decisions.md.</text>
</svg>
